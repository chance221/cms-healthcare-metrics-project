[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-medicaid-pipeline"
version = "0.1.0"
description = "Medicare/Medicaid nursing home data pipeline: raw -> silver -> gold (PySpark), Streamlit dashboard"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["pyspark_jobs*", "streamlit_app*"]
