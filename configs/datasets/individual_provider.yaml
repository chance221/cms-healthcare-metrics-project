dataset_name: individual_provider
description: "Skilled Nursing Facility roster extract"
raw:
  prefix_pattern: "{env}/01-raw/{period}/*ProviderInfo*.csv.gz"
  format: csv


primary_key: [ccn]

# No true "last updated" column exists in this file; using the
# extract's own processing date as the recency signal for within-batch dedup.
dedup_order_by: processing_date

# If a CCN present in a prior silver load is absent from today's
# extract, does that mean the facility closed (delete) or just a data gap (keep)?
delete_missing_keys: false

schema:
  - { name: ccn, type: string, nullable: false, expected_raw_header: "CMS Certification Number (CCN)" }
  - { name: provider_name, type: string, nullable: true, expected_raw_header: "Provider Name" }
  - { name: provider_address, type: string, nullable: true, expected_raw_header: "Provider Address" }
  - { name: city, type: string, nullable: true, expected_raw_header: "City/Town" }
  - { name: state, type: string, nullable: true, expected_raw_header: "State" }
  - { name: zip_code, type: string, nullable: true, expected_raw_header: "ZIP Code" }
  - { name: telephone_number, type: string, nullable: true, expected_raw_header: "Telephone Number" }
  - { name: ssa_county_code, type: string, nullable: true, expected_raw_header: "Provider SSA County Code" }
  - { name: county, type: string, nullable: true, expected_raw_header: "County/Parish" }
  - { name: ownership_type, type: string, nullable: true, expected_raw_header: "Ownership Type" }
  - { name: certified_beds, type: int, nullable: true, expected_raw_header: "Number of Certified Beds" }
  - { name: avg_residents_per_day, type: double, nullable: true, expected_raw_header: "Average Number of Residents per Day" }
  - { name: avg_residents_per_day_footnote, type: string, nullable: true, expected_raw_header: "Average Number of Residents per Day Footnote" }
  - { name: provider_type, type: string, nullable: true, expected_raw_header: "Provider Type" }
  - { name: resides_in_hospital, type: string, nullable: true, expected_raw_header: "Provider Resides in Hospital" }
  - { name: legal_business_name, type: string, nullable: true, expected_raw_header: "Legal Business Name" }
  - { name: date_first_approved, type: timestamp, nullable: true, expected_raw_header: "Date First Approved to Provide Medicare and Medicaid Services" }
  - { name: affiliated_entity_name, type: string, nullable: true, expected_raw_header: "Affiliated Entity Name" }
  - { name: affiliated_entity_id, type: string, nullable: true, expected_raw_header: "Affiliated Entity ID" }
  - { name: ccrc_status, type: string, nullable: true, expected_raw_header: "Continuing Care Retirement Community" }
  - { name: special_focus_status, type: string, nullable: true, expected_raw_header: "Special Focus Status" }
  - { name: abuse_icon, type: string, nullable: true, expected_raw_header: "Abuse Icon" }
  - { name: health_inspection_over_2_years, type: string, nullable: true, expected_raw_header: "Most Recent Health Inspection More Than 2 Years Ago" }
  - { name: ownership_changed_last_12_months, type: string, nullable: true, expected_raw_header: "Provider Changed Ownership in Last 12 Months" }
  - { name: resident_family_council, type: string, nullable: true, expected_raw_header: "With a Resident and Family Council" }
  - { name: automatic_sprinkler_systems, type: string, nullable: true, expected_raw_header: "Automatic Sprinkler Systems in All Required Areas" }
  - { name: overall_rating, type: int, nullable: true, expected_raw_header: "Overall Rating" }
  - { name: overall_rating_footnote, type: string, nullable: true, expected_raw_header: "Overall Rating Footnote" }
