name: Apply infrastructure and deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Get and Inspect OIDC Token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            // JWT is split into header, payload, signature
            const payloadBase64 = token.split('.')[1];
            const payloadJson = Buffer.from(payloadBase64, 'base64').toString('utf8');
            const claims = JSON.parse(payloadJson);
            
            console.log("Full OIDC Claims:", claims);
            console.log("aud (Audience):", claims.aud);
            console.log("sub (Subject):", claims.sub);     

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::440107864885:role/github_apply_role
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Streamlit image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: cms-proj-streamlit
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -f prod.dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.16"

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: terraform plan -var="streamlit_image_tag=prod-${{ github.sha }}"

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve -var="streamlit_image_tag=prod-${{ github.sha }}"

      - name: Refresh Airflow code bundle if the instance is running
        working-directory: terraform/environments/dev
        run: |
          INSTANCE_ID=$(terraform output -raw airflow_instance_id)
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "$STATE" = "running" ]; then
            echo "Instance is running -- pushing refreshed code bundle."
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["aws s3 cp s3://cms-project-python-scripts-cjk-2026/airflow-bundle.zip /opt/airflow-bundle.zip","unzip -o /opt/airflow-bundle.zip -d /opt/airflow"]'
          else
            echo "Instance is not running ($STATE) -- skipping refresh. The next on-demand start will pull the current code automatically."
          fi
